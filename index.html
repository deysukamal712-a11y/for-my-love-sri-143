<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You</title>

<style>
  body {
    margin: 0;
    height: 100vh;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    transition: background 1s ease;
    color: rgba(255,255,255,0.92);
  }

  .screen {
    height: 100vh;
    width: 100vw;
    padding: 60px 40px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .text {
    font-size: 20px;
    line-height: 1.7;
    max-width: 900px;
  }

  .choices {
    margin-top: 30px;
  }

  .choices button {
    background: rgba(255,255,255,0.15);
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 30px;
    font-size: 16px;
    margin: 8px 10px 0 0;
    cursor: pointer;
  }

  .hint {
    opacity: 0.4;
    font-size: 13px;
  }
</style>
</head>

<body onclick="next()">

<div id="app"></div>

<script>
let i = 0;
let answers = {}; // store her choices

const slides = [
  { bg:"#0f172a", text:`Hey.<br><br>This isn’t a website trying to impress you. This is just me… slowing down for a second, because you matter enough to deserve that.` },

  { bg:"#1e293b", text:`Before anything else, I want you to know this: none of this is random. You didn’t just “end up” here. You’re here because you changed something in me.` },

  { bg:"#020617", text:`Let me ask you something simple first.`, choices:["I’m listening","Go on"] },

  { bg:"#111827", text:`Do you ever realize how easily you make things feel calmer? Like… even on loud days, you somehow soften the noise.`, choices:["Yes","I never noticed"] },

  { bg:"#1f2937", text:`You don’t have to notice it. I do. And I carry it quietly.` },

  { bg:"#0b132b", text:`I don’t love you in a dramatic, movie-dialogue way. I love you in a way that plans. In a way that stays. In a way that doesn’t disappear when things get heavy.` },

  { bg:"#312e81", text:`Sometimes I imagine our future — not the flashy parts — but the boring, safe, peaceful ones. Mornings. Arguments that end in understanding. Silence that doesn’t feel empty.` },

  { bg:"#1e1b4b", text:`Quick check 🐱`, choices:["I like cats","I am the cat"] },

  { bg:"#0f172a", text:`Correct answer accepted. No further questions.` },

  { bg:"#020617", text:`I want you to know how hard I’m trying. Not just for “success” — but to become someone who can protect your peace, not disturb it.` },

  { bg:"#111827", text:`You deserve consistency. You deserve effort that doesn’t need reminders. You deserve a love that feels safe even when everything else isn’t.` },

  { bg:"#1f2937", text:`If one day you ever wonder whether you’re “too much”… I need you to remember this moment. You’re not too much. You’re exactly right.` },

  { bg:"#0b132b", text:`Tell me honestly.`, choices:["You matter to me","I already knew that"] },

  { bg:"#312e81", text:`Good. Because I wasn’t planning to stop proving it anyway.` },

  { bg:"#020617", text:`I don’t promise perfection. I promise presence. I promise growth. I promise choosing you even on days where it would be easier not to think deeply.` },

  { bg:"#111827", text:`There are parts of me that became softer because of you. Braver. More patient. More intentional.` },

  { bg:"#1f2937", text:`If love had a weight, this is where I carry it — not in words I show off, but in choices I repeat.` },

  { bg:"#0f172a", text:`Another honest question.`, choices:["Okay","You ask a lot"] },

  { bg:"#020617", text:`Do you feel safe here?`, choices:["Yes","I’m starting to"] },

  { bg:"#1e293b", text:`That’s all I ever wanted this to feel like.` },

  { bg:"#020617", text:`I see you. I admire you. I choose you — not because it’s easy, but because it’s meaningful.` },

  { bg:"#111827", text:`So let me say this clearly, without overthinking, without hiding behind jokes.` },

  { bg:"#0b132b", text:`I want to keep building something with you. Slowly. Honestly. Intentionally.` },

  { bg:"#020617", text:`Will you stay with me and keep choosing this too?`, choices:["Yes","I’m already here"] },

  { bg:"#000000", text:`Good. Then let’s stop rushing life — and do this properly. Together.` }
];

function render() {
  const s = slides[i];
  document.body.style.background = s.bg;

  const hasChoices = !!s.choices;

  document.getElementById("app").innerHTML = `
    <div class="screen" ${hasChoices ? "" : "onclick='next()'"} >
      <div class="text">${s.text}</div>
      <div>
        ${hasChoices ? `
          <div class="choices">
            ${s.choices.map(c =>
              `<button onclick="choose('${c}')">${c}</button>`
            ).join("")}
          </div>
        ` : ""}
        <div class="hint">${hasChoices ? "choose an option" : "tap anywhere"}</div>
      </div>
    </div>
  `;
}

function next() {
  if (i < slides.length - 1) {
    i++;
    render();
  }
}

function choose(answer) {
  answers[i] = answer; // store answer
  next();
}

render();
</script>

</body>
</html>
